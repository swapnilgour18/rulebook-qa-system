<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rulebook QA Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rulebook QA Assistant</h1>
            <p>Ask questions about university policies, rules, and regulations.</p>
        </header>

        <main>
            <div class="qa-section">
                <div class="input-group">
                    <textarea id="questionInput" placeholder="E.g., What is the minimum attendance requirement?" rows="3"></textarea>
                    <button id="askBtn">Ask</button>
                </div>
                
                <div id="loadingIndicator" class="hidden">
                    <div class="spinner"></div>
                    <span>Analyzing rulebook...</span>
                </div>

                <div id="responseArea" class="hidden">
                    <div class="status-indicator" id="statusIndicator"></div>
                    
                    <div class="answer-box">
                        <h3>Answer</h3>
                        <p id="answerText"></p>
                    </div>

                    <div class="sources-box" id="sourcesBox">
                        <h3>Sources Evidence</h3>
                        <div id="sourcesList"></div>
                    </div>
                </div>
                
                <div id="errorArea" class="hidden error-box">
                    <p id="errorText"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
